name: E2E – powiadomienia o komentarzach

# Uruchomienie ręczne z zakładki Actions ("Run workflow") z wyborem zestawu testów.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Zestaw testów
        type: choice
        default: all
        options: [all, positive, negative, regression, R1, R2, R3]
      notification_wait:
        description: Czas czekania na powiadomienie w sekundach (dłuższy wyklucza, że „brak” to duże opóźnienie)
        type: choice
        default: '20'
        options: ['20', '60', '120', '300', '600']
      video:
        description: Wideo z całego testu dla każdego testu (domyślnie tylko przy błędzie)
        type: boolean
        default: false

concurrency:
  # Testy współdzielą konta i listę testową – nie uruchamiamy dwóch przebiegów naraz.
  group: e2e-kislist
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://kislist.com' }}
      KIS_LIST_ID: ${{ secrets.KIS_LIST_ID }}
      KIS_ITEM_ID: ${{ secrets.KIS_ITEM_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PIOTR_EMAIL: ${{ secrets.PIOTR_EMAIL }}
      PIOTR_PASSWORD: ${{ secrets.PIOTR_PASSWORD }}
      MARCIN_EMAIL: ${{ secrets.MARCIN_EMAIL }}
      MARCIN_PASSWORD: ${{ secrets.MARCIN_PASSWORD }}
      GUEST_EMAIL: ${{ secrets.GUEST_EMAIL }}
      GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
      # Zaufane urządzenie (cookie devid) – logowanie bez kodu 2FA, np. dla prywatnej skrzynki administratora
      ADMIN_DEVICE_ID: ${{ secrets.ADMIN_DEVICE_ID }}
      PIOTR_DEVICE_ID: ${{ secrets.PIOTR_DEVICE_ID }}
      MARCIN_DEVICE_ID: ${{ secrets.MARCIN_DEVICE_ID }}
      GUEST_DEVICE_ID: ${{ secrets.GUEST_DEVICE_ID }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      CLIENT_SHARE_URL: ${{ secrets.CLIENT_SHARE_URL }}
      CLIENT_PROPOSAL_URL: ${{ secrets.CLIENT_PROPOSAL_URL }}
    steps:
      - uses: actions/checkout@v5

      # Testy działają w obrazie z Dockerfile (Playwright + przeglądarki + zależności) – to samo środowisko co lokalnie
      # (`docker run --env-file .env kis-lists-tests`). Warstwy obrazu są cache'owane między przebiegami.
      - uses: docker/setup-buildx-action@v3
      - name: Obraz testów (Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kis-lists-tests
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Czytelny błąd na starcie zamiast nieudanego logowania po kilku minutach.
      - name: Kontrola sekretów
        run: |
          missing=()
          for name in KIS_LIST_ID CLIENT_SHARE_URL CLIENT_PROPOSAL_URL GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN \
            ADMIN_EMAIL ADMIN_PASSWORD PIOTR_EMAIL PIOTR_PASSWORD MARCIN_EMAIL MARCIN_PASSWORD GUEST_EMAIL GUEST_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Brak sekretów: %s\n' "${missing[*]}"
            exit 1
          fi
          [ -n "$ADMIN_DEVICE_ID" ] || echo "::warning::Brak ADMIN_DEVICE_ID – logowanie administratora może wymagać kodu 2FA"

      - name: Testy E2E (w kontenerze)
        env:
          SUITE: ${{ inputs.suite }}
          VIDEO: ${{ inputs.video && 'on' || '' }}
          NOTIFICATION_WAIT_S: ${{ inputs.notification_wait }}
        run: |
          export NOTIFICATION_WINDOW_MS=$(( NOTIFICATION_WAIT_S * 1000 ))
          # Zmienne przekazywane jako `-e NAZWA` (wartość z env tego kroku) – sekrety nie trafiają do wiersza poleceń.
          env_args=()
          for name in BASE_URL KIS_LIST_ID KIS_ITEM_ID CLIENT_SHARE_URL CLIENT_PROPOSAL_URL VIDEO NOTIFICATION_WINDOW_MS \
            ADMIN_EMAIL ADMIN_PASSWORD ADMIN_DEVICE_ID PIOTR_EMAIL PIOTR_PASSWORD PIOTR_DEVICE_ID \
            MARCIN_EMAIL MARCIN_PASSWORD MARCIN_DEVICE_ID GUEST_EMAIL GUEST_PASSWORD GUEST_DEVICE_ID \
            GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN; do
            env_args+=(-e "$name")
          done
          grep_args=()
          if [ "$SUITE" != "all" ]; then grep_args=(--grep "@$SUITE"); fi
          mkdir -p allure-results playwright-report test-results
          docker run --rm "${env_args[@]}" \
            -v "$PWD/allure-results:/app/allure-results" \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            kis-lists-tests npx playwright test "${grep_args[@]}"

      # Raport jako jeden plik HTML (allurerc.mjs: singleFile) – po pobraniu artefaktu wystarczy otworzyć index.html.
      - name: Raport Allure (w kontenerze)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p allure-report
          docker run --rm -v "$PWD/allure-results:/app/allure-results" -v "$PWD/allure-report:/app/allure-report" \
            kis-lists-tests npx allure generate allure-results

      - name: Podsumowanie przebiegu
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "allure-report/summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const { stats, status, duration } = JSON.parse(fs.readFileSync(file, "utf8"));
            const rows = Object.entries(stats).map(([k, v]) => `| ${k} | ${v} |`).join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## E2E – powiadomienia o komentarzach (${process.env.SUITE}, czekanie ${process.env.WAIT} s)\n\n` +
              `Status: **${status}**, czas: ${Math.round(duration / 1000)} s\n\n| wynik | liczba |\n| --- | --- |\n${rows}\n\n` +
              "Raport: artefakt **allure-report** → `index.html` (otwiera się bez serwera).\n" +
              "Testy `@regression` odtwarzają znane błędy (BUG-01…03) i są czerwone do czasu poprawki.\n");
          '
        env:
          SUITE: ${{ inputs.suite }}
          WAIT: ${{ inputs.notification_wait }}

      # Raport Allure: jeden plik – zrzuty JPEG z każdego kroku, wideo błędów (albo wszystkich testów przy opcji „video”).
      - name: Artefakt – raport Allure
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      # Trace Playwrighta (kroki, DOM, sieć) jest tylko tutaj – raport Allure go nie zawiera.
      - name: Artefakt – raport Playwright z trace (tylko przy błędach)
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
