name: E2E – powiadomienia o komentarzach

# Uruchomienie ręczne z zakładki Actions ("Run workflow") z wyborem zestawu testów.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Zestaw testów
        type: choice
        default: all
        options: [all, positive, negative, regression, R1, R2, R3]
      playwright_report:
        description: Dołącz też raport Playwright (większy artefakt)
        type: boolean
        default: false

concurrency:
  # Testy współdzielą konta i listę testową – nie uruchamiamy dwóch przebiegów naraz.
  group: e2e-kislist
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://kislist.com' }}
      KIS_LIST_ID: ${{ secrets.KIS_LIST_ID }}
      KIS_ITEM_ID: ${{ secrets.KIS_ITEM_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PIOTR_EMAIL: ${{ secrets.PIOTR_EMAIL }}
      PIOTR_PASSWORD: ${{ secrets.PIOTR_PASSWORD }}
      MARCIN_EMAIL: ${{ secrets.MARCIN_EMAIL }}
      MARCIN_PASSWORD: ${{ secrets.MARCIN_PASSWORD }}
      GUEST_EMAIL: ${{ secrets.GUEST_EMAIL }}
      GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
      # Zaufane urządzenie (cookie devid) – logowanie bez kodu 2FA, np. dla prywatnej skrzynki administratora
      ADMIN_DEVICE_ID: ${{ secrets.ADMIN_DEVICE_ID }}
      PIOTR_DEVICE_ID: ${{ secrets.PIOTR_DEVICE_ID }}
      MARCIN_DEVICE_ID: ${{ secrets.MARCIN_DEVICE_ID }}
      GUEST_DEVICE_ID: ${{ secrets.GUEST_DEVICE_ID }}
      ADMIN_DISPLAY_NAME: ${{ vars.ADMIN_DISPLAY_NAME }}
      PIOTR_DISPLAY_NAME: ${{ vars.PIOTR_DISPLAY_NAME }}
      MARCIN_DISPLAY_NAME: ${{ vars.MARCIN_DISPLAY_NAME }}
      GUEST_DISPLAY_NAME: ${{ vars.GUEST_DISPLAY_NAME }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      CLIENT_SHARE_URL: ${{ secrets.CLIENT_SHARE_URL }}
      CLIENT_PROPOSAL_URL: ${{ secrets.CLIENT_PROPOSAL_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalacja przeglądarki
        run: npx playwright install --with-deps chromium

      # Czytelny błąd na starcie zamiast nieudanego logowania po kilku minutach.
      - name: Kontrola sekretów
        run: |
          missing=()
          for name in KIS_LIST_ID CLIENT_SHARE_URL \
            ADMIN_EMAIL ADMIN_PASSWORD PIOTR_EMAIL PIOTR_PASSWORD MARCIN_EMAIL MARCIN_PASSWORD GUEST_EMAIL GUEST_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ -z "$GMAIL_REFRESH_TOKEN" ] && [ -z "$MAILOSAUR_API_KEY" ]; then
            missing+=("GMAIL_CLIENT_ID/GMAIL_CLIENT_SECRET/GMAIL_REFRESH_TOKEN (albo MAILOSAUR_*)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Brak sekretów: %s\n' "${missing[*]}"
            exit 1
          fi
          [ -n "$ADMIN_DEVICE_ID" ] || echo "::warning::Brak ADMIN_DEVICE_ID – logowanie administratora może wymagać kodu 2FA"

      - name: Testy E2E
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [ "$SUITE" = "all" ]; then
            npx playwright test
          else
            npx playwright test --grep "@$SUITE"
          fi

      # Raport jako jeden plik HTML (allurerc.mjs: singleFile) – po pobraniu artefaktu wystarczy otworzyć index.html.
      - name: Raport Allure
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results

      - name: Podsumowanie przebiegu
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "allure-report/summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const { stats, status, duration } = JSON.parse(fs.readFileSync(file, "utf8"));
            const rows = Object.entries(stats).map(([k, v]) => `| ${k} | ${v} |`).join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## E2E – powiadomienia o komentarzach (${process.env.SUITE})\n\n` +
              `Status: **${status}**, czas: ${Math.round(duration / 1000)} s\n\n| wynik | liczba |\n| --- | --- |\n${rows}\n\n` +
              "Raport: artefakt **allure-report** → `index.html` (otwiera się bez serwera).\n" +
              "Testy `@regression` odtwarzają znane błędy (BUG-01…03) i są czerwone do czasu poprawki.\n");
          '
        env:
          SUITE: ${{ inputs.suite }}

      # Artefakty liczą się do limitu miejsca konta GitHub (dla repozytoriów prywatnych), więc wysyłamy tylko
      # raport Allure (jeden plik – zawiera zrzuty, wideo i trace błędów) i krótko go przechowujemy.
      - name: Artefakt – raport Allure
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Artefakt – raport Playwright (tylko przy błędach)
        uses: actions/upload-artifact@v5
        if: ${{ failure() && inputs.playwright_report }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
